[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Backyard Monsters Refitted team"]
license = "GPL-3.0"
edition = "2024"
publish = false

[workspace.dependencies]
bymr-input-protocol = { path = "crates/protocol" }
windows-sys = "0.61.2"

[profile.release]
panic = "abort"
