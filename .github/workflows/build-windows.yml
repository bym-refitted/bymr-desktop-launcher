name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # flash-input is 32-bit to match the 32-bit standalone Flash Player
          targets: i686-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./flash-input -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Flash input fix
        working-directory: flash-input
        run: cargo build --release

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BASE_URL: https://server.bymrefitted.com
        # tauri.flash-input.conf.json bundles bymr-player.exe and bymr_input.dll (Windows only)
        run: npm run tauri build -- --bundles nsis,msi --config src-tauri/tauri.flash-input.conf.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: bymr-launcher-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: bymr-launcher-windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
